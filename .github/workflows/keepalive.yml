name: supabase-keepalive

on:
  schedule:
    # Daily at 05:00 UTC.
    - cron: "00 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ping CopyEngine and Lighthouse Goals
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python keepalive.py --restore \
            --project hozgmfumpzphanvykemt \
            --project jibclxfdxyrimgovhcih

      - name: Ping LCP in its new Supabase organisation
        if: ${{ !cancelled() }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_LCP }}
        run: |
          python keepalive.py --restore \
            --project jgfktiwpfqexqjkudpxg
