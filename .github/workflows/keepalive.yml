name: supabase-keepalive

on:
  schedule:
    # Daily at 05:00 UTC.
    - cron: "00 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ping CopyEngine and Lighthouse Goals
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python keepalive.py --restore \
            --project hozgmfumpzphanvykemt \
            --project jibclxfdxyrimgovhcih

      - name: Ping LCP in its new Supabase organisation
        if: ${{ !cancelled() }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_LCP }}
        run: |
          python keepalive.py --restore \
            --project jgfktiwpfqexqjkudpxg

      - name: Report successful completion to Healthchecks
        if: ${{ success() }}
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${HEALTHCHECKS_PING_URL}" ]]; then
            echo "::error::HEALTHCHECKS_PING_URL is missing."
            exit 1
          fi

          if ! curl --fail --silent \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 2 \
            --retry-delay 5 \
            --output /dev/null \
            "${HEALTHCHECKS_PING_URL}"; then
            echo "::error::Could not send the success heartbeat."
            exit 1
          fi

          echo "Success heartbeat delivered."

      - name: Report failure to Healthchecks
        if: ${{ failure() }}
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${HEALTHCHECKS_PING_URL}" ]]; then
            echo "::warning::Cannot report failure: ping URL is missing."
            exit 0
          fi

          if ! curl --fail --silent \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 2 \
            --retry-delay 5 \
            --output /dev/null \
            "${HEALTHCHECKS_PING_URL%/}/fail"; then
            echo "::warning::Could not deliver the failure heartbeat."
          else
            echo "Failure heartbeat delivered."
          fi
